version: '3.8'

services:
  lavadero-api:
    build: .
    ports:
      - '3000:3000'
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm run start:dev"
    depends_on:
      - redis
      - database
      # - whatsapp-service
    networks:
      - lavadero-network

  redis:
    image: redis:6-alpine
    ports:
      - '${REDIS_PORT}:${REDIS_PORT}'
    env_file:
      - .env
    networks:
      - lavadero-network

  database:
    image: postgres:14
    container_name: lavadero-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: '${DB_USER}'
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
      POSTGRES_DB: '${DB_NAME}'
    ports:
      - '${DB_PORT}:${DB_PORT}'
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - lavadero-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lavadero.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - database
    networks:
      - lavadero-network

